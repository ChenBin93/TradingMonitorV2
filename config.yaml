timeframes:
- 5m
- 1h
- 4h
indicators:
  5m:
    roc_period: 5
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
  1h:
    roc_period: 10
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
  4h:
    roc_period: 20
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
rs:
  momentum_windows:
    5m:  [1, 2, 3]
    1h:  [1, 2, 3]
    4h:  [1, 2, 3]
  weight_mode: decay
history:
  lookback_days:
  - 90
  - 180
  - 365
  db_path: data/history.db
position:
  enabled: false
  interval_seconds: 60
  pnl_loss_pct: 5.0
  pnl_profit_pct: 10.0
  max_hours: 4
  auto_exit: true
  initial_sl_pct: 3.0
health:
  enabled: true
  port: 8080
logging:
  level: INFO
  file: logs/main.log
account:
  risk_pct: 1
  leverage: 10
# 预警图表推送 (需飞书应用开通 im:resource 权限; 全图表化一条消息)
feishu_image:
  enabled: true         # 已开通权限 (2026-09-01)
  max_per_scan: 5       # 每轮扫描最多几张图 (防刷屏)
  min_level: L1         # 所有级别都出图 (L3 > L2 > L1 优先排序)
