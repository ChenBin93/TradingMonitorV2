timeframes:
- 5m
- 1h
- 4h
scan_interval: 300
indicators:
  5m:
    roc_period: 5
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
  1h:
    roc_period: 10
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
  4h:
    roc_period: 20
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
rs:
