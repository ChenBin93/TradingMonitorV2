timeframes:
- 15m
- 1h
- 4h
scan_interval: 900
indicators:
  15m:
    roc_period: 5
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
  1h:
    roc_period: 10
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
  4h:
    roc_period: 20
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2
    atr_period: 14
    volume_ma_period: 20
    ma_short: 5
    ma_mid: 20
    ma_long: 60
alert:
  dedup_minutes: 60
  min_confidence: 0.65
history:
  lookback_days:
  - 90
  - 180
  - 365
  db_path: data/history.db
position:
  enabled: false
  interval_seconds: 60
  pnl_loss_pct: 5.0
  pnl_profit_pct: 10.0
  max_hours: 4
  auto_exit: true
  initial_sl_pct: 3.0
health:
  enabled: true
  port: 8080
logging:
  level: INFO
  file: logs/main.log

# --- 仓位计算 ---
account:
  risk_pct: 15          # 每笔风险占本金比例 (%)
  leverage: 10          # 杠杠倍数
